<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>미디 시그리스트</title>

<style>
  * {
    box-sizing: border-box;
  }

  html {
    -webkit-text-size-adjust: 100%;
  }

  body {
    margin: 0;
    background: #ffffff;
    color: #222;
    font-family:
      Pretendard,
      -apple-system,
      BlinkMacSystemFont,
      "Apple SD Gothic Neo",
      "Noto Sans KR",
      "Segoe UI",
      sans-serif;
  }

  .page {
    width: min(760px, calc(100% - 28px));
    margin: 0 auto;
    padding: 38px 0 70px;
  }

  .hero {
    text-align: center;
    margin-bottom: 24px;
  }

  .character-wrap {
    height: 210px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    overflow: hidden;
    margin-bottom: 2px;
  }

  .character {
    display: block;
    width: 230px;
    max-width: 70vw;
    height: auto;
    object-fit: contain;
    filter: drop-shadow(0 10px 18px rgba(0,0,0,.06));
  }

  h1 {
    margin: 8px 0 4px;
    font-size: 28px;
    line-height: 1.25;
    letter-spacing: -0.04em;
    font-weight: 800;
  }

  .subtitle {
    margin: 0;
    font-size: 14px;
    color: #8c8c8c;
    letter-spacing: -0.02em;
  }

  .search-wrap {
    margin: 22px 0 16px;
  }

  .search {
    width: 100%;
    height: 52px;
    border: 1px solid #e5e5e5;
    border-radius: 14px;
    display: flex;
    align-items: center;
    background: #fff;
    transition: .18s ease;
    box-shadow: 0 2px 12px rgba(0,0,0,.025);
  }

  .search:focus-within {
    border-color: #d7b7bd;
    box-shadow: 0 0 0 4px rgba(215,183,189,.14);
  }

  .search-icon {
    width: 52px;
    flex: 0 0 52px;
    display: grid;
    place-items: center;
    color: #a7a7a7;
  }

  .search-icon svg {
    width: 21px;
    height: 21px;
  }

  #searchInput {
    flex: 1;
    min-width: 0;
    height: 100%;
    border: 0;
    outline: 0;
    padding: 0 16px 0 0;
    background: transparent;
    color: #222;
    font-size: 15px;
    font-family: inherit;
  }

  #searchInput::placeholder {
    color: #b6b6b6;
  }

  .table-card {
    border: 1px solid #ececec;
    border-radius: 14px;
    overflow: hidden;
    background: #fff;
  }

  .table-head,
  .sig-row {
    display: grid;
    grid-template-columns: 120px 1fr;
    align-items: center;
  }

  .table-head {
    min-height: 48px;
    background: #fafafa;
    border-bottom: 1px solid #ececec;
    color: #555;
    font-size: 13px;
    font-weight: 700;
  }

  .head-btn {
    height: 48px;
    border: 0;
    background: transparent;
    font: inherit;
    color: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 0 20px;
  }

  .head-btn:last-child {
    justify-content: flex-start;
  }

  .sort-mark {
    color: #c98f9a;
    font-size: 11px;
  }

  .sig-row {
    min-height: 48px;
    border-bottom: 1px solid #f0f0f0;
    font-size: 14px;
    transition: background .12s ease;
  }

  .sig-row:last-child {
    border-bottom: 0;
  }

  .sig-row:hover {
    background: #fcf8f9;
  }

  .num,
  .name {
    padding: 13px 20px;
  }

  .num {
    color: #444;
    font-variant-numeric: tabular-nums;
  }

  .name {
    color: #222;
    font-weight: 500;
    word-break: keep-all;
  }

  .meta {
    display: flex;
    justify-content: flex-end;
    margin-top: 12px;
    padding: 0 2px;
    color: #9a9a9a;
    font-size: 12px;
  }

  .meta strong {
    color: #c6818f;
    font-weight: 700;
  }

  .empty {
    padding: 54px 20px;
    text-align: center;
    color: #aaa;
    font-size: 14px;
  }

  mark {
    color: inherit;
    background: #fff0f3;
    border-radius: 3px;
    padding: 0 1px;
  }

  @media (max-width: 560px) {
    .page {
      width: min(100% - 20px, 760px);
      padding-top: 18px;
    }

    .character-wrap {
      height: 172px;
    }

    .character {
      width: 190px;
    }

    h1 {
      font-size: 24px;
    }

    .search-wrap {
      margin-top: 18px;
    }

    .table-head,
    .sig-row {
      grid-template-columns: 82px 1fr;
    }

    .head-btn,
    .num,
    .name {
      padding-left: 14px;
      padding-right: 14px;
    }

    .sig-row {
      font-size: 13.5px;
    }
  }
</style>
</head>

  const searchInput = document.getElementById("searchInput");
  const sigList = document.getElementById("sigList");
  const meta = document.getElementById("meta");
  const sortNum = document.getElementById("sortNum");
  const sortName = document.getElementById("sortName");
  const numMark = document.getElementById("numMark");
  const nameMark = document.getElementById("nameMark");

  let sortKey = "num";
  let sortDir = "asc";

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, ch => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    })[ch]);
  }

  function highlight(text, query) {
    const safeText = escapeHTML(text);
    if (!query) return safeText;

    const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const re = new RegExp(`(${escapedQuery})`, "ig");
    return safeText.replace(re, "<mark>$1</mark>");
  }

  function getFiltered() {
    const q = searchInput.value.trim().toLowerCase();

    let arr = DATA.filter(item => {
      if (!q) return true;
      return String(item.num).includes(q) || item.name.toLowerCase().includes(q);
    });

    arr.sort((a, b) => {
      let cmp = 0;

      if (sortKey === "num") {
        cmp = a.num - b.num;
        if (cmp === 0) cmp = a.name.localeCompare(b.name, "ko");
      } else {
        cmp = a.name.localeCompare(b.name, "ko");
        if (cmp === 0) cmp = a.num - b.num;
      }

      return sortDir === "asc" ? cmp : -cmp;
    });

    return arr;
  }

  function updateSortMarks() {
    numMark.textContent = sortKey === "num" ? (sortDir === "asc" ? "▲" : "▼") : "";
    nameMark.textContent = sortKey === "name" ? (sortDir === "asc" ? "▲" : "▼") : "";
  }

  function render() {
    const q = searchInput.value.trim();
    const filtered = getFiltered();

    if (!filtered.length) {
      sigList.innerHTML = `<div class="empty">검색 결과가 없습니다.</div>`;
    } else {
      sigList.innerHTML = filtered.map(item => `
        <div class="sig-row">
          <div class="num">${highlight(item.num, q)}</div>
          <div class="name">${highlight(item.name, q)}</div>
        </div>
      `).join("");
    }

    meta.innerHTML = q
      ? `검색 결과&nbsp; <strong>${filtered.length}</strong>개 / 전체 ${DATA.length}개`
      : `총&nbsp; <strong>${DATA.length}</strong>개의 곡이 있습니다.`;

    updateSortMarks();
  }

  sortNum.addEventListener("click", () => {
    if (sortKey === "num") {
      sortDir = sortDir === "asc" ? "desc" : "asc";
    } else {
      sortKey = "num";
      sortDir = "asc";
    }
    render();
  });

  sortName.addEventListener("click", () => {
    if (sortKey === "name") {
      sortDir = sortDir === "asc" ? "desc" : "asc";
    } else {
      sortKey = "name";
      sortDir = "asc";
    }
    render();
  });

  searchInput.addEventListener("input", render);

  render();
</script>
